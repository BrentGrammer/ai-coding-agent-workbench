User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
Logfile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 100
Allow 127.0.0.1
Allow ::1
Filter "/etc/tinyproxy/agent-egress-allowlist.txt"
FilterURLs Off
FilterExtended Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443
ConnectPort 80
