#!/usr/sbin/nft -f

flush ruleset

table inet workbench {
  chain output {
    type filter hook output priority 0; policy accept;

    # Reject IMDS for the agent user
    meta skuid "agent" ip daddr 169.254.169.254 reject

    # Allow agent traffic to loopback (local proxy)
    meta skuid "agent" oif "lo" accept

    # Allow agent traffic to the GPU box inference port, inside the VPC only.
    # setup-workbench.sh fills in the CIDR from instance metadata.
    meta skuid "agent" ip daddr @VPC_CIDR@ tcp dport 11435 accept

    # Drop all other outbound traffic from agent
    meta skuid "agent" drop
  }
}
